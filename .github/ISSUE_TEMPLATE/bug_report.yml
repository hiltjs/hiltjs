name: Bug report
description: Something behaves differently from what the documentation or types say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security issue, please do not file it here. See SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        The smallest view-model or snippet that shows it. The kernel needs no
        renderer to run, so a failing test is usually the clearest form.
      render: typescript
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package and version
      placeholder: '@hiltjs/core 0.1.0'
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Node and TypeScript versions
      placeholder: 'Node 22.18, TypeScript 6.0.3'
    validations:
      required: true

  - type: input
    id: rxjs
    attributes:
      label: RxJS version
      description: >
        RxJS is a peer dependency. If you have more than one copy in your tree,
        say so, since that alone explains a whole class of type errors.
      placeholder: '7.8.2, single copy'
    validations:
      required: true
