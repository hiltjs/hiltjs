name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # OIDC. There is no npm token: npmjs.com trusts this repo and this filename.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

      # No `publish` input: changesets would run it through pnpm, which cannot
      # do OIDC publishing yet (pnpm/pnpm#9812).
      - name: Version pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          commit: 'Version packages'
          title: 'Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Trusted publishing needs npm >= 11.5.1.
          npm install -g npm@latest

          VERSION=$(node -p "require('./packages/core/package.json').version")
          TAG="@hiltjs/core@${VERSION}"

          if npm view "@hiltjs/core@${VERSION}" version >/dev/null 2>&1; then
            echo "${TAG} is already on the registry."
            exit 0
          fi

          pnpm run build
          npm publish ./packages/core --provenance --access public

          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

          node -e "
            const fs = require('node:fs');
            const section = fs.readFileSync('packages/core/CHANGELOG.md', 'utf8').split(/^## /m)[1] ?? '';
            fs.writeFileSync('/tmp/notes.md', section.split('\n').slice(1).join('\n').trim());
          "
          gh release create "${TAG}" --title "${TAG}" --notes-file /tmp/notes.md
