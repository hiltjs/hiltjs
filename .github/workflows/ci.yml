name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the LIBRARY supports. `@hiltjs/core` declares `engines: node >=20`, so
  # its sources have to typecheck and its suite has to pass on that floor.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    name: test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typechecks the sources AND the examples, so a snippet that no longer
      # compiles fails here rather than in someone's editor.
      - run: pnpm run typecheck

      - run: pnpm run lint

      - run: pnpm run format:check

      # Compiling the examples proves they are valid. This proves the READMEs
      # actually print them, which is the part a reader copies.
      - run: pnpm run check:examples

      - run: pnpm run test

  # What the TOOLCHAIN needs, which is a different question: tsdown declares
  # `engines: ^22.18.0 || >=24.11.0` and calls `Promise.withResolvers`, absent
  # before Node 22. Building on the library's floor fails for reasons that say
  # nothing about the library, so the build gets its own job.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # The published artifact is what consumers actually get. Assert its
      # properties on the artifact itself rather than trusting the config.
      - name: Verify the publishable package
        working-directory: packages/core
        run: |
          pnpm pack --pack-destination /tmp
          echo '--- tarball contents ---'
          tar -tzf /tmp/hiltjs-core-*.tgz
          if tar -tzf /tmp/hiltjs-core-*.tgz | grep -qE '\.test\.|/src/'; then
            echo 'ERROR: tests or sources leaked into the tarball'; exit 1
          fi
          if ! grep -q 'from "rxjs"' dist/index.js; then
            echo 'ERROR: rxjs was inlined instead of left as a peer import'; exit 1
          fi

      # Both entry points must load and expose the surface. A build that emits
      # files nobody can import is still a green build.
      - name: Smoke-test both entry points
        working-directory: packages/core
        run: |
          node -e "import('./dist/index.js').then(m => {
            if (typeof m.ViewModelBase !== 'function') throw new Error('ESM: ViewModelBase missing');
            console.log('ESM ok');
          })"
          node -e "
            const m = require('./dist/index.cjs');
            if (typeof m.ViewModelBase !== 'function') throw new Error('CJS: ViewModelBase missing');
            console.log('CJS ok');
          "
