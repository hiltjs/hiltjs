name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the library supports: `engines` promises Node 20.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    name: test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run check:examples
      - run: pnpm run test

  # What the toolchain needs: tsdown declares `engines: ^22.18.0 || >=24.11.0`.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Verify the publishable package
        working-directory: packages/core
        run: |
          pnpm pack --pack-destination /tmp
          tar -tzf /tmp/hiltjs-core-*.tgz
          if tar -tzf /tmp/hiltjs-core-*.tgz | grep -qE '\.test\.|/src/'; then
            echo 'ERROR: tests or sources leaked into the tarball'; exit 1
          fi
          if ! grep -q 'from "rxjs"' dist/index.js; then
            echo 'ERROR: rxjs was inlined instead of left as a peer import'; exit 1
          fi

      - name: Smoke-test both entry points
        working-directory: packages/core
        run: |
          node -e "import('./dist/index.js').then(m => {
            if (typeof m.ViewModelBase !== 'function') throw new Error('ESM: ViewModelBase missing');
            console.log('ESM ok');
          })"
          node -e "
            const m = require('./dist/index.cjs');
            if (typeof m.ViewModelBase !== 'function') throw new Error('CJS: ViewModelBase missing');
            console.log('CJS ok');
          "
